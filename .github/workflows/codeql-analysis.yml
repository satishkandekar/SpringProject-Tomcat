name: "CodeQL Analysis"

on:
  push:
    branches:
      - master
      - 'feature/**'
      - main
  pull_request:
    types:
      - closed
      - merged
    branches:
      - master
  # schedule:
  #   - cron: '0 0 * * 0'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Build the code
        run: |
          # Command to build your Java Spring Boot application
          ./mvnw clean package

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2