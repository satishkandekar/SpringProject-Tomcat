name: Reusable Container Builder

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Docker image name'
        required: true
        type: string
      java-version:
        description: 'Java version'
        default: '8'
        type: string
    secrets:
      DOCKERHUB_USERNAME:  # Changed to match standard naming
        required: true
      DOCKERHUB_TOKEN:     # Changed to match standard naming
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: |
          mvn clean package
          if [ ! -f "target/spring-boot-docker.jar" ]; then
            echo "::error::JAR file not found at target/spring-boot-docker.jar"
            ls -la target/
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ inputs.image-name }}:latest