name: SonarCloud Scan

on:
  push:
    branches:
      - master
      - main
      - feature/**
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # Needed for PR decoration
      security-events: write  # Needed to publish security events

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for proper analysis of new code

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'  # Simpler alternative to manual caching

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          args: >
            -Dsonar.ci.autoconfig.disabled=true
            -Dsonar.projectKey=satishkandekar_spring-boot-hello-world
            -Dsonar.organization=satishkandekar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # For PR decoration
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}  # Your SonarCloud token