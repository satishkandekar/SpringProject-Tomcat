name: Reusable Code Scanner

on:
  workflow_call:
    inputs:
      project-key:
        description: 'SonarCloud project key'
        required: true
        type: string
      organization:
        description: 'SonarCloud organization'
        required: true
        type: string
    secrets:
      sonar-token:
        required: true

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.sonar-token }}
        with:
          args: >
            -Dsonar.projectKey=satishkandekar_spring-boot-hello-world
            -Dsonar.organization=satishkandekar
            -Dsonar.java.binaries=target