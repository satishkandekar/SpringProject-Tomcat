name: Reusable SonarCloud Scan

on:
  workflow_call:
    inputs:
      project-key:
        description: 'SonarCloud project key'
        required: true
        type: string
      organization:
        description: 'SonarCloud organization'
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.ci.autoconfig.disabled=true
            -Dsonar.ci.skipAutomaticAnalysis=true
            -Dsonar.projectKey='satishkandekar_spring-boot-hello-world'
            -Dsonar.organization='satishkandekar'
            -Dsonar.java.binaries=target